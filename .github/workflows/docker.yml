name: Publish Edge TTS Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'Drunk-Dream/ms-ra-forwarder' && github.ref == 'refs/heads/fix/edge-tts-2026-10'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Docker setup QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Docker setup Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Docker login
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Build and push docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ghcr.io/drunk-dream/ms-ra-forwarder:edge-tts-${{ github.sha }}
        labels: org.opencontainers.image.source=https://github.com/Drunk-Dream/ms-ra-forwarder
